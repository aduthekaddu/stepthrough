frontmatter:
  id: js-execution-context
  track: javascript
  title: Execution context, hoisting and the TDZ
  minutes: 90
  prereqs: [js-values]
  outcomes:
    - Describe what an execution context and an environment record hold, and draw the call stack and records for a small program
    - Predict the state of every var, let, const, function and parameter binding after declaration instantiation, and explain hoisting as its visible effect
    - Explain the temporal dead zone (including typeof and an inner name that shadows an outer one), why let and const were designed with it, and how sloppy and strict code differ for undeclared names
  sources:
    - https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-execution-contexts
    - https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-environment-records
    - https://tc39.es/ecma262/multipage/ecmascript-language-scripts-and-modules.html#sec-globaldeclarationinstantiation
    - https://tc39.es/ecma262/multipage/ordinary-and-exotic-objects-behaviours.html#sec-functiondeclarationinstantiation
    - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let
    - https://developer.mozilla.org/en-US/docs/Glossary/Hoisting
  interviewTags: [frontend, fullstack, javascript]
  status: draft
  verifiedAt: 2026-11

# Every behaviour the lesson states rests on one of these. Spec text was read from the
# multipage edition on 2026-11-15; Node outputs are from Node 26.13.1 run as classic scripts (node -e).
facts:
  - id: f-ec-def
    text: "An execution context is a specification device that is used to track the runtime evaluation of code by an ECMAScript implementation. At most one is running per agent: the running execution context."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-execution-contexts
  - id: f-ec-stack
    text: "The execution context stack is used to track execution contexts. The running execution context is always the top element. A new execution context is created whenever control is transferred to code not associated with the running one, and is pushed onto the stack."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-execution-contexts
  - id: f-ec-fields
    text: "State components for all execution contexts: code evaluation state; Function (the function object, or null for a Script or Module); Realm; ScriptOrModule. Additional components for ECMAScript code: LexicalEnvironment identifies the Environment Record used to resolve identifier references; VariableEnvironment identifies the Environment Record that holds bindings created by VariableStatements; PrivateEnvironment (class private names)."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-execution-contexts
  - id: f-ec-not-observable
    text: "An execution context is purely a specification mechanism and need not correspond to any particular artefact of an ECMAScript implementation. It is impossible for ECMAScript code to directly access or observe an execution context. The same is said of Environment Records."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-execution-contexts
  - id: f-env-def
    text: "Environment Record is a specification type used to define the association of Identifiers to specific variables and functions. Each time a FunctionDeclaration, BlockStatement or Catch clause is evaluated, a new one is created. Every Environment Record has an [[OuterEnv]] field, which is either null or a reference to an outer Environment Record."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-environment-records
  - id: f-fn-env
    text: "A Function Environment Record corresponds to the invocation of an ECMAScript function object, and contains bindings for the top-level declarations within that function. NewFunctionEnvironment sets its [[OuterEnv]] to func.[[Environment]]."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-newfunctionenvironment
  - id: f-global-env
    text: "A Global Environment Record is a record encapsulating an Object Environment Record (whose binding object is the global object) and a Declarative Environment Record. The [[ObjectRecord]] holds built-in globals and bindings from FunctionDeclaration and VariableStatement in global code; all other declarations in global code go in the [[DeclarativeRecord]]. Its [[OuterEnv]] is null."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-global-environment-records
  - id: f-lookup
    text: "GetIdentifierReference(env, name): if env is null, return an unresolvable reference; if env.HasBinding(name), return a reference to env; otherwise recurse with env.[[OuterEnv]]. ResolveBinding starts from the running execution context's LexicalEnvironment."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-getidentifierreference
  - id: f-getvalue
    text: "GetValue: if the reference is unresolvable, throw a ReferenceError; otherwise for an environment reference return base.GetBindingValue(name)."
    url: https://tc39.es/ecma262/multipage/ecmascript-data-types-and-values.html#sec-getvalue
  - id: f-uninit-read
    text: "Declarative GetBindingValue: If the binding exists but is uninitialized a ReferenceError is thrown, regardless of the value of strict."
    url: https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-declarative-environment-records-getbindingvalue-n-s
  - id: f-typeof
    text: 'typeof: if the operand is an unresolvable reference, return "undefined". Otherwise call GetValue, which throws for an uninitialized binding.'
    url: https://tc39.es/ecma262/multipage/ecmascript-language-expressions.html#sec-typeof-operator-runtime-semantics-evaluation
  - id: f-putvalue
    text: "PutValue on an unresolvable reference: if strict, throw a ReferenceError; else Set(globalObj, name, value, false)."
    url: https://tc39.es/ecma262/multipage/ecmascript-data-types-and-values.html#sec-putvalue
  - id: f-script-eval
    text: "ScriptEvaluation creates scriptContext with Function null and LexicalEnvironment = VariableEnvironment = the global environment, pushes it, runs GlobalDeclarationInstantiation, then evaluates the script's statements, then removes the context."
    url: https://tc39.es/ecma262/multipage/ecmascript-language-scripts-and-modules.html#sec-runtime-semantics-scriptevaluation
  - id: f-gdi
    text: "GlobalDeclarationInstantiation: lexically declared names are created with CreateImmutableBinding (const) or CreateMutableBinding (let, class) and 'only instantiated here but not initialized'; for each function declaration (last one wins) InstantiateFunctionDeclaration creates the function object and CreateGlobalFunctionBinding stores it; var names that are not function names get CreateGlobalVarBinding, which creates and initializes them to undefined only if the global object has no such own property yet (so var Object; keeps the built-in). Conflicts with existing lexical names throw a SyntaxError before any binding is made."
    url: https://tc39.es/ecma262/multipage/ecmascript-language-scripts-and-modules.html#sec-globaldeclarationinstantiation
  - id: f-call
    text: "PrepareForOrdinaryCall creates calleeContext with Function = func, LexicalEnvironment = VariableEnvironment = NewFunctionEnvironment(func), and pushes it. [[Call]] then evaluates the body and removes calleeContext, restoring the caller's context."
    url: https://tc39.es/ecma262/multipage/ordinary-and-exotic-objects-behaviours.html#sec-prepareforordinarycall
  - id: f-body
    text: "EvaluateFunctionBody: Perform FunctionDeclarationInstantiation(funcObj, argList), then evaluate the FunctionStatementList."
    url: https://tc39.es/ecma262/multipage/ecmascript-language-functions-and-classes.html#sec-runtime-semantics-evaluatefunctionbody
  - id: f-fdi
    text: "FunctionDeclarationInstantiation: parameters are created and bound to the arguments (left to right; created uninitialized unless names repeat); each var name not already a parameter is created and initialized to undefined; lexically declared names are 'only instantiated here but not initialized'; each function declaration's function object is created and stored. 'A var with the same name as a formal parameter initially has the same value as the corresponding initialized parameter.' Non-strict functions put top-level let/const in a separate record (for direct eval)."
    url: https://tc39.es/ecma262/multipage/ordinary-and-exotic-objects-behaviours.html#sec-functiondeclarationinstantiation
  - id: f-let-note
    text: "let and const variables are created when their containing Environment Record is instantiated but may not be accessed in any way until the variable's LexicalBinding is evaluated. let x; with no initializer sets undefined at that point. const without an initializer is a SyntaxError."
    url: https://tc39.es/ecma262/multipage/ecmascript-language-statements-and-declarations.html#sec-let-and-const-declarations
  - id: f-var-note
    text: "Var variables are created when their containing Environment Record is instantiated and are initialized to undefined when created. A VariableDeclaration with an Initializer is assigned when it is executed. var x; (no initializer) evaluates to: Return empty."
    url: https://tc39.es/ecma262/multipage/ecmascript-language-statements-and-declarations.html#sec-variable-statement
  - id: f-fn-eval
    text: "Evaluating a FunctionDeclaration returns empty (does nothing). A FunctionExpression evaluates to InstantiateOrdinaryFunctionExpression; an ArrowFunction to InstantiateArrowFunctionExpression, so those function objects are created when the expression runs."
    url: https://tc39.es/ecma262/multipage/ecmascript-language-functions-and-classes.html#sec-function-definitions-runtime-semantics-evaluation
  - id: f-strict-code
    text: "Global code is strict if it begins with a Use Strict Directive; module code is always strict; all parts of a class are strict; function code is strict if it is inside strict code or begins with the directive. Code that is not strict is called non-strict code."
    url: https://tc39.es/ecma262/multipage/ecmascript-language-source-code.html#sec-strict-mode-code
  - id: f-strict-annex
    text: "Annex C: Assignment to an undeclared identifier or otherwise unresolvable reference does not create a property in the global object. In strict mode code it throws a ReferenceError."
    url: https://tc39.es/ecma262/multipage/strict-mode-of-ecmascript.html#sec-strict-mode-of-ecmascript
  - id: f-mdn-hoisting
    text: "Hoisting is not a term normatively defined in the ECMAScript specification. MDN lists four behaviours that may be regarded as hoisting: value hoisting (function declarations), declaration hoisting (var: value undefined), a declaration changing behaviour in its scope before its line (let, const, class), and side effects of a declaration produced before the rest of the code (import)."
    url: https://developer.mozilla.org/en-US/docs/Glossary/Hoisting
  - id: f-mdn-tdz
    text: "A let, const or class variable is in a TDZ from the start of the block until code execution reaches the place where it is declared and initialized. 'The term temporal is used because the zone depends on the order of execution (time) rather than the order in which the code is written (position).' typeof in the TDZ throws a ReferenceError. let at the top level of a script does not create a property on globalThis."
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let
  - id: f-mdn-var
    text: "In a script, a top-level var is added as a non-configurable property of the global object. In Node.js CommonJS modules and ES modules, top-level declarations are scoped to the module and not added to the global object. Duplicate var declarations do not lose the value unless they have an initializer."
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var
  - id: f-mdn-function
    text: "Function declarations are hoisted to the top of the enclosing function or global scope. Function expressions are not hoisted: notHoisted(); var notHoisted = function () {} throws TypeError: notHoisted is not a function."
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function
  - id: f-hopl-tdz
    text: "Wirfs-Brock and Eich, JavaScript: The First 20 Years (HOPL 2020), pp. 111-113: Waldemar Horwat listed four semantics for a name used above its block-level declaration: A1 lexical dead zone, A2 lexical window, B1 temporal dead zone, B2 temporal window. A2 and B2 let one name mean different bindings at different points or times; A1 prevents mutually recursive functions. TC39 chose B1. Rules: one binding per name in a scope; let, const, class, import, block functions and parameters are dead until initialized; accessing or assigning an uninitialized binding is a runtime error. Global object properties cannot be marked uninitialized, so global let, const and class are not global object properties."
    url: https://doi.org/10.1145/3386327
  - id: f-node-messages
    text: 'Measured in Node 26.13.1: reading a let/const/class in its TDZ throws "ReferenceError: Cannot access ''x'' before initialization"; reading an undeclared name throws "ReferenceError: x is not defined"; calling undefined throws "TypeError: x is not a function". engine262 (the trace engine) words the TDZ error "x cannot be used before initialization". The message text is engine-specific.'
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Errors/Cant_access_lexical_declaration_before_init
  - id: f-module-var
    text: "Measured in Node 26.13.1: inside an ES module, var x = 1; console.log(globalThis.x) prints undefined; as a classic script (node -e) it prints 1."
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var
  - id: f-jls
    text: "Java (JLS 6.3): the scope of a local variable 'is the rest of the block, starting with the declaration's own initializer'; the scope of a class member 'is the entire body' of the class. JLS 16: every local variable must be definitely assigned before any access of its value, or a compile-time error occurs."
    url: https://docs.oracle.com/javase/specs/jls/se21/html/jls-6.html#jls-6.3
  - id: f-zod
    text: "Zod docs, Recursive objects: 'To define a self-referential type, use a getter on the key. This lets JavaScript resolve the cyclical schema at runtime.'"
    url: https://zod.dev/api#recursive-objects

