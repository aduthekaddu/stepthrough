    [
      EXC-TOP-TO-BOTTOM,
      EXC-HOIST-MOVES-CODE,
      EXC-TDZ-IS-UNDEFINED,
      EXC-HOIST-LET-NOT-HOISTED,
      EXC-TDZ-IS-SPATIAL,
      EXC-HOIST-ALL-FUNCTIONS,
      EXC-GLOBAL-LET-ON-OBJECT,
      EXC-GLOBAL-ASSIGN-MAKES-LOCAL,
    ]
  secondary:
    [
      EXC-HOIST-FN-AS-VAR,
      EXC-LOCALS-PERSIST,
      EXC-CALL-NO-WAIT,
      EXC-LOOKUP-MISSING-IS-UNDEFINED,
      EXC-TYPEOF-UNDECLARED-THROWS,
      EXC-GLOBAL-NOTHING-ON-OBJECT,
      EXC-TDZ-TYPEOF-SAFE,
      EXC-GLOBAL-ASSIGN-ALWAYS-WORKS,
    ]
  added_after_review: [EXC-IMPLICIT-NOT-PROPERTY, EXC-LOOKUP-AT-DEFINITION]
