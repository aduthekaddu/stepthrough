    [
      EXC-VAR-REDECLARE-RESETS,
      EXC-HOIST-CLASS-LIKE-FUNCTION,
      EXC-HOIST-VAR-BEATS-FUNCTION,
      EXC-HOIST-FN-LINE-ASSIGNS,
      EXC-TDZ-PARAMS-EXEMPT,
    ]
  notes: "Entries whose sources say Inferred are hypotheses until the learner's logged answers confirm them."

segments:
  - id: s01-hook
    goal: "A name can be read before its line, and var and let disagree about what you get"
    terms_introduced: []
    terms_used: []
    words: 40-80
    code: examples in the Predict (hook)
    interaction:
      {
        kind: predict,
        id: hook,
        targets: [EXC-HOIST-MOVES-CODE, EXC-TOP-TO-BOTTOM, EXC-TDZ-IS-UNDEFINED],
      }
    note: "Reveal real output; defer the explanation to s09 and s10."
  - id: s02-setup-first
    goal: "The engine sets up every declared name before the first line runs"
    terms_introduced: [declaration]
    terms_used: [engine, binding]
    words: 100-150
    interaction:
      - { kind: predict, id: call-early, targets: [EXC-TOP-TO-BOTTOM, EXC-HOIST-FN-AS-VAR] }
      - { kind: run, code: "console.log(typeof double) before function double prints function" }
    doubt: "If code runs top to bottom, how can line 1 call a function from line 2?"
  - id: s03-records
    goal: "Names live in a table of bindings called an environment record"
    terms_introduced: [environment-record]
    terms_used: [declaration, binding]
    words: 120-170
    visual:
      {
        component: Viz,
        example: ec-global-setup,
        view: scope,
        gate: call-early,
        pauseAt: [1],
        new_parts: [record box, binding rows, decl kind label, uninitialized state],
      }
    interaction: { kind: step, id: viz-global-setup }
    doubt: "Is the record a real thing in memory?"
  - id: s04-context
    goal: "Each running piece of code has an execution context that points to its records"
    terms_introduced: [execution-context, function-environment]
    terms_used: [environment-record, call stack]
    words: 150-220
    visual:
      {
        component: Viz,
        example: ec-first-call,
        view: scope,
        pauseAt: [2],
        new_parts: [stack region, function record],
      }
    interaction:
      - {
          kind: predict,
          id: call-order,
          targets: [EXC-CALL-NO-WAIT],
          note: "concrete case first: a call pauses the caller",
        }
      - { kind: step, id: viz-first-call }
    doubt: "Is an execution context the same thing as a stack frame from lesson 0.1?"
  - id: s05-each-call
    goal: "Every call gets a new execution context and a new record, so each call has its own local bindings"
    terms_introduced: []
    terms_used: [execution-context, function-environment, call stack]
    words: 90-140
    interaction: { kind: predict, id: countdown, targets: [EXC-LOCALS-PERSIST, EXC-CALL-NO-WAIT] }
    visual:
      { component: Viz, example: ec-countdown, view: scope, gate: countdown, pauseAt: [7, 12] }
  - id: s06-lookup
    goal: "A lookup walks outer references until it finds the name or runs out of records"
    terms_introduced: [outer-reference, scope-chain]
    terms_used: [environment-record, typeof]
    words: 140-200
    interaction:
      {
        kind: predict,
        id: lookup,
        targets: [EXC-LOOKUP-MISSING-IS-UNDEFINED, EXC-TYPEOF-UNDECLARED-THROWS],
      }
    visual:
      {
        component: Viz,
        example: ec-lookup,
        view: scope,
        gate: lookup,
        pauseAt: [4],
        new_parts: [outer arrow],
      }
    doubt: "Why does the outer of full point to page and not to whoever called it?"
  - id: s07-global
    goal: "The global record has two parts, and only var and function land on the global object"
    terms_introduced: [global-environment, global-object]
    terms_used: [environment-record, declaration]
    words: 150-220
    interaction:
      - {
          kind: predict,
          id: globals,
          targets: [EXC-GLOBAL-LET-ON-OBJECT, EXC-GLOBAL-NOTHING-ON-OBJECT],
        }
      - {
          kind: run,
          code: "let b = 2; b, globalThis.b, 'b' in globalThis prints 2 undefined false",
        }
    doubt: "Why would the language keep two kinds of global names?"
  - id: s08-instantiation
    goal: "Declaration instantiation gives each declaration kind its own starting state"
    terms_introduced: [declaration-instantiation]
    terms_used: [declaration, environment-record, execution-context]
    words: 180-240
    code: "table of kinds; runnable var redeclare (var color twice prints red)"
    interaction:
      {
        kind: predict,
        id: unreachable,
        targets: [EXC-TOP-TO-BOTTOM, EXC-HOIST-FN-AS-VAR],
        transfer: true,
      }
  - id: s09-hoisting
    goal: "Hoisting is a teaching name for the effects of declaration instantiation; no code moves"
    terms_introduced: [hoisting]
    terms_used: [declaration-instantiation]
    words: 120-180
    visual: { component: Viz, example: ec-hook-replay, view: scope, gate: hook, pauseAt: [1] }
    interaction: { kind: step, id: viz-hook-replay }
    doubt: "Then why does everyone say declarations move to the top?"
  - id: s10-tdz
    goal: "A let or const binding exists before its line but has no value, and touching it throws"
    terms_introduced: [tdz]
    terms_used: [declaration-instantiation, outer-reference]
    words: 150-210
    interaction:
      {
        kind: predict,
        id: tdz-shadow,
        targets: [EXC-HOIST-LET-NOT-HOISTED, EXC-TDZ-IS-UNDEFINED, EXC-HOIST-MOVES-CODE],
      }
    visual: { component: Viz, example: ec-tdz-shadow, view: scope, gate: tdz-shadow, pauseAt: [3] }
    note: "One sentence: blocks get their own records too (lesson 1.3); runnable block example."
  - id: s11-typeof
    goal: "typeof does not protect you from a binding in its TDZ"
    terms_introduced: []
    terms_used: [tdz, scope-chain, typeof]
    words: 90-140
    interaction:
      {
        kind: predict,
        id: tdz-typeof,
        targets: [EXC-TDZ-TYPEOF-SAFE, EXC-TYPEOF-UNDECLARED-THROWS],
      }
  - id: s12-temporal
    goal: "The dead zone is about when code runs, not where it is written"
    terms_introduced: []
    terms_used: [tdz]
    words: 90-140
    interaction:
      - { kind: predict, id: temporal, targets: [EXC-TDZ-IS-SPATIAL] }
      - { kind: predict, id: temporal-moved, modify: true, targets: [EXC-TDZ-IS-SPATIAL] }
  - id: s13-why-tdz
    goal: "The TDZ was chosen so one name means one binding and a const is never seen with two values"
    terms_introduced: []
    terms_used: [tdz, global-object, environment-record]
    words: 180-250
    interaction:
      - {
          kind: run,
          code: "isEven/isOdd const arrows that call each other print true (why option 1 was rejected)",
        }
      - { kind: explain, id: why-tdz }
    doubt: "Would it not be simpler to give let undefined, like var?"
  - id: s14-functions
    goal: "Only function declarations get their function object during instantiation"
    terms_introduced: [function-expression]
    terms_used: [declaration-instantiation, tdz]
    words: 140-200
    interaction:
      {
        kind: predict,
        id: fn-forms,
        targets: [EXC-HOIST-ALL-FUNCTIONS, EXC-HOIST-FN-AS-VAR, EXC-TOP-TO-BOTTOM],
      }
