detail: teaching
granularity: statement
steps:
  - at: { mark: call, kind: statement }
    say: "The global record holds only save. No record anywhere has a binding called total."
    expect:
      - { record: Global, binding: total, absent: true }
  - at: { mark: assign, kind: enter }
    say: "save is running. Its own record is empty, and the global record still has no total."
    expect:
      - { stackDepth: 2, stackTop: save }
      - { record: Global, binding: total, absent: true }
  - at: { kind: return }
    say: "The lookup for total reached the end of the chain without finding it. This code is not strict, so the engine created a property named total on the global object."
    expect:
      - { record: Global, binding: total, decl: implicit, value: "42" }
  - at: { mark: read, kind: statement }
    say: "save has returned, but total is still there, because it lives on the global object and not in save's record."
    expect:
      - { stackDepth: 1 }
      - { record: Global, binding: total, value: "42" }
  - at: { kind: end }
    say: "The script printed 42."
    expect:
      - { console: ["42"] }
