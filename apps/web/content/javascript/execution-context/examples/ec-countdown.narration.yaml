detail: teaching
granularity: statement
steps:
  - at: { mark: start, kind: statement }
    say: "Only the script's context is on the stack. countdown is a function in the global record."
    expect:
      - { stackDepth: 1 }
      - { record: Global, binding: countdown, value: "function countdown" }
  - at: { mark: body, kind: enter }
    say: "First call: a new context and a new record. n is 2 and label is undefined."
    expect:
      - { stackDepth: 2 }
      - { record: "countdown() call", binding: n, value: "2" }
      - { record: "countdown() call", binding: label, value: "undefined" }
  - at: { mark: recurse, kind: statement }
    say: "label now holds \"n=2\". This line calls countdown again while the first call is still running, so the first call pauses here."
    expect:
      - { record: "countdown() call", binding: label, value: '"n=2"' }
  - at: { mark: log, kind: statement }
    say: "The first call to reach this line is the third one, with n = 0. Three countdown records exist at the same time, one per call, each with its own n and label. Each call will log its own label as the stack unwinds."
    expect:
      - { stackDepth: 4 }
      - { record: "countdown() call", binding: label, value: '"n=2"' }
      - { record: "countdown() call #2", binding: label, value: '"n=1"' }
      - { record: "countdown() call #3", binding: label, value: '"n=0"' }
      - { console: [] }
