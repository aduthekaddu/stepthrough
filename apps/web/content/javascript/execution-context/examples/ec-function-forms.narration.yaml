detail: teaching
granularity: statement
steps:
  - at: { mark: first, kind: statement }
    say: "Before line 1: declared already holds a function, expressed holds undefined, and arrow is in its TDZ."
    expect:
      - { record: Global, binding: declared, value: "function declared" }
      - { record: Global, binding: expressed, value: "undefined" }
      - { record: Global, binding: arrow, value: "uninitialized" }
  - at: { mark: expressed, kind: statement }
    say: "Line 1 printed function. Line 2 got no step: a function declaration does nothing when execution reaches it."
    expect:
      - { console: ["function"] }
      - { record: Global, binding: expressed, value: "undefined" }
  - at: { mark: arrow, kind: statement }
    say: "Line 3 ran. The function expression was evaluated just now, and only now does expressed hold a function."
    expect:
      - { record: Global, binding: expressed, value: "function expressed" }
      - { record: Global, binding: arrow, value: "uninitialized" }
  - at: { mark: last, kind: statement }
    say: "Line 4 created the arrow function and ended arrow's TDZ. All three names now hold functions."
    expect:
      - { record: Global, binding: arrow, value: "function arrow" }
