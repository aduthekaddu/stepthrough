detail: teaching
granularity: statement
steps:
  - at: { mark: first, kind: statement }
    say: "Declaration instantiation is done and no statement has run. price exists with undefined; total exists with no value."
    expect:
      - { record: Global, binding: price, decl: var, value: "undefined" }
      - { record: Global, binding: total, decl: let, state: uninitialized }
  - at: { mark: price, kind: statement }
    say: "Line 1 read price, found undefined, and printed it."
    expect:
      - { console: ["undefined"] }
      - { record: Global, binding: price, value: "undefined" }
  - at: { mark: read, kind: statement }
    say: "Line 2 ran. For a var, the line is only an assignment, so price changed from undefined to 100."
    expect:
      - { record: Global, binding: price, value: "100" }
      - { record: Global, binding: total, state: uninitialized }
  - at: { kind: throw }
    say: "Line 3 found total, but total is still uninitialized, so the read threw a ReferenceError and the script stopped. Line 4 never ran."
    expect:
      - { stackDepth: 0 }
      - { record: Global, binding: total, state: uninitialized }
      - { uncaught: "ReferenceError: total cannot be used before initialization" }
