detail: teaching
granularity: statement
steps:
  - at: { mark: start, kind: statement }
    say: "Only the script's context is on the stack. countdown is a function in the global record."
    expect:
      - { stackDepth: 1 }
  - at: { mark: body, kind: enter }
    say: "First call: a new context and a new record. n is 2 and label is undefined."
    expect:
      - { stackDepth: 2 }
      - { record: "countdown() call", binding: n, value: "2" }
      - { record: "countdown() call", binding: label, value: "undefined" }
  - at: { mark: body, kind: enter }
    say: "The first call called countdown again. That is a second context with its own record. The first record still says label is \"n=2\"."
    expect:
      - { stackDepth: 3 }
      - { record: "countdown() call", binding: label, value: '"n=2"' }
      - { record: "countdown() call #2", binding: n, value: "1" }
      - { record: "countdown() call #2", binding: label, value: "undefined" }
  - at: { mark: body, kind: enter }
    say: "Third call. Three countdown records exist at the same time, one per call, each with its own n and label."
    expect:
      - { stackDepth: 4, stackTop: countdown }
      - { record: "countdown() call #2", binding: label, value: '"n=1"' }
      - { record: "countdown() call #3", binding: n, value: "0" }
  - at: { mark: log, kind: statement }
    say: "In the third call n is 0, so it does not call again. It is about to log its own label."
    expect:
      - { record: "countdown() call #3", binding: label, value: '"n=0"' }
  - at: { kind: return }
    say: "The third call printed n=0 and is returning."
    expect:
      - { console: ["n=0"] }
  - at: { mark: log, kind: statement }
    say: "Back in the second call. The third call never touched this record, so label still says \"n=1\"."
    expect:
      - { stackDepth: 3 }
      - { recordAbsent: "countdown() call #3" }
      - { record: "countdown() call #2", binding: label, value: '"n=1"' }
  - at: { kind: end }
    say: "Each call logged its own label, from the deepest call back out to the first."
    expect:
      - { stackDepth: 0 }
      - { console: ["n=0", "n=1", "n=2"] }
