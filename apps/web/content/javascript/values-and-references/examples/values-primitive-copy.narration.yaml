detail: teaching
granularity: statement
steps:
  - at: { mark: start, kind: statement }
    say: "The Global box lists the names this script declares; both exist already but hold nothing yet, a waiting state that lesson 1.2 explains."
    expect:
      - { record: Global, binding: a, value: "uninitialized" }
      - { record: Global, binding: b, value: "uninitialized" }
      - { stackDepth: 1 }
  - at: { mark: before-copy, kind: statement }
    say: "The name a now holds the number 5, a primitive, written inside its row."
    expect:
      - { record: Global, binding: a, value: "5" }
      - { record: Global, binding: b, value: "uninitialized" }
  - at: { mark: before-reassign, kind: statement }
    say: "let b = a read the value of a, which is 5, and gave b that value, and nothing links the two names."
    expect:
      - { record: Global, binding: a, value: "5" }
      - { record: Global, binding: b, value: "5" }
  - at: { mark: done, kind: statement }
    say: "a = 6 changed only the row for a, so the row for b still says 5."
    expect:
      - { record: Global, binding: a, value: "6" }
      - { record: Global, binding: b, value: "5" }
      - { console: [] }
