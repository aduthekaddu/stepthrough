detail: teaching
granularity: statement
steps:
  - at: { mark: start, kind: statement }
    say: "The function declaration already made a function object, which is an object like any other, and the name rename points to it."
    expect:
      - { record: Global, binding: rename, value: "→obj0" }
      - { record: Global, binding: player, value: "<TDZ>" }
  - at: { mark: before-call, kind: statement }
    say: "player points to one object whose name is \"Aditya\"."
    expect:
      - { record: Global, binding: player, value: "→obj1" }
      - { object: obj1, prop: name, value: "\"Aditya\"" }
      - { stackDepth: 1 }
  - at: { mark: in-call, kind: enter }
    say: "The call pushed a new stack frame with its own box of names, and the parameter user got a copy of player's arrow, so it points to the same object."
    expect:
      - { stackDepth: 2 }
      - { record: "rename() call", binding: user, value: "→obj1" }
      - { record: Global, binding: player, value: "→obj1" }
  - at: { mark: after-mutate, kind: statement }
    say: "user.name = \"Riya\" followed user's arrow and changed the shared object, which player sees because it points to the same object."
    expect:
      - { object: obj1, prop: name, value: "\"Riya\"" }
      - { record: "rename() call", binding: user, value: "→obj1" }
  - at: { kind: return }
    say: "user = { name: \"Kabir\" } made a new object and moved only the arrow in the rename() box, while player's arrow stayed put."
    expect:
      - { record: "rename() call", binding: user, value: "→obj2" }
      - { record: Global, binding: player, value: "→obj1" }
      - { object: obj2, prop: name, value: "\"Kabir\"" }
  - at: { mark: done, kind: statement }
    say: "The call is over and its box is gone, and since nothing points to the Kabir object any more, the diagram drops it (the garbage collector may reclaim its memory later)."
    expect:
      - { stackDepth: 1 }
      - { absent: obj2 }
      - { object: obj1, prop: name, value: "\"Riya\"" }
  - at: { kind: end }
    say: "The script printed Riya: the mutation inside the call stayed, the reassignment did not reach player."
    expect:
      - { console: ["Riya"] }
