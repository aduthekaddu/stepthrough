design_decisions:
  - "Hook: pass an object, mutate it, then reassign the parameter. It splits the two main wrong models (copy vs true pass-by-reference) and Aditya meets the same rule in Java, so s10 can resolve it with a Java contrast."
  - "Primitives are drawn inside their binding row and objects as separate boxes with arrows. This is the trace format's drawing choice; s04 and s11 say it is a drawing, not where an engine stores values."
  - 'Narration expectations use only the shapes the build checks: { record, binding, value } (value is the primitive text, "uninitialized", or "object" / "array" / "function <name>" for a reference), { stackDepth }, { record, exists }, { console }. These cannot say that two bindings share one object or what a property holds; the observable result of each example is pinned by its Predict answer (content-check runs it) instead. Every step needs a mark, and end and return frames have no source line, so they cannot be narrated; values-pass-object.js adds return user.name; to get a frame right after the reassignment.'
  - "Every snippet runs as a classic script (node -e), matching the trace generator and the browser sandbox. The string index write in s05 is silently ignored in sloppy mode and throws in strict mode; both are shown."
  - "12 Predicts (the brief's upper bound), plus 6 next-frame pauses in 5 traces and 3 mid-lesson explain prompts (s10, s14, s19)."
  - "Added after review: runnable blocks in s02 (Number vs bigint precision), s14 (rules 4, 6, 7 and 8 at work) and s16 (Object.assign writes into its target), each a real interaction that also keeps prose runs under 250 words."

segments:
  - id: s01-hook
    goal: "Passing an object to a function, changing it, then reassigning the parameter gives a result most people do not expect"
    terms_introduced: []
    terms_used: []
    words: 20-50
    code: "function rename(user) { user.name = 'Riya'; user = { name: 'Kabir' }; } const player = { name: 'Aditya' }; rename(player); console.log(player.name);"
    visual: null
    interaction:
      {
        kind: predict,
        id: hook,
        answer: "Riya",
        options:
          [
            "Aditya -> VAL-ASSIGN-COPIES-OBJECT",
            "Riya (correct)",
            "Kabir -> VAL-PASS-BY-REFERENCE",
          ],
      }
    doubt: null
    reveal: "Show the real output; defer the explanation to s10."

  - id: s02-values
    goal: "Everything a program works with is a value, and the spec puts every value in one of eight types: seven primitive types and Object"
    terms_introduced: [value, primitive, object]
    terms_used: [engine]
    words: 130-170
    code: "runnable: console.log of one value of each primitive type, then an object, an array and a function"
    visual: null
    interaction: { kind: run }
    doubt: "Arrays and functions feel like their own types. Are they not?"
    facts: [language-types, object-type, null-type, mdn-immutable]

  - id: s03-typeof
    goal: 'typeof names a value''s type as a string, with two oddities: null gives "object" and functions give "function"'
    terms_introduced: [typeof]
    terms_used: [value, primitive, object]
    words: 120-170
    code: "console.log(typeof null, typeof [1, 2], typeof function () {});"
    interaction:
      {
        kind: predict,
        id: typeof,
        answer: "object object function",
        options:
          [
            "object object function (correct)",
            "null object function -> VAL-TYPEOF-NULL",
            "object array function -> VAL-TYPEOF-ARRAY",
          ],
      }
    doubt: "If null is not an object, why does typeof say it is?"
    facts: [typeof-algorithm, typeof-null-history]

  - id: s04-bindings
    goal: "A binding is a name that holds a value; let b = a gives b the value a has now, and nothing links the two names afterwards"
    terms_introduced: [binding]
    terms_used: [value, primitive, memory]
    words: 130-170
    code: examples/values-primitive-copy.js
    visual:
      {
        component: MemoryDiagram,
        example: values-primitive-copy,
        new_parts: [global-box, binding-row, inline-primitive],
        pauseAt: [3],
      }
    interaction: { kind: predict-next-frame, at_step: 3, question: "What changes when a = 6 runs?" }
    doubt: "Doesn't b = a tie b to a, like a formula in a spreadsheet?"
    teaching_model: "Abramov's 'wire' is a teaching word, not a JS term (he says so). The spec word is binding."
    facts: [wires]

  - id: s05-immutable
    goal: "A primitive value can never be changed; code that seems to change one makes a new value and points a binding at it"
    terms_introduced: [immutable]
    terms_used: [primitive, binding, value]
    words: 110-150
    code: "runnable: word[0] = 'b' is ignored; toUpperCase returns a new string; x = x + 1 rebinding"
    interaction: { kind: run }
    doubt: "But count = count + 1 changes count!"
    facts: [mdn-immutable, wires]

  - id: s06-references
    goal: "An object lives on its own and a binding holds a reference to it, so let b = a copies the reference and both names reach one object"
    terms_introduced: [reference]
    terms_used: [object, binding, value]
    words: 120-170
    code: examples/values-alias.js
    interaction:
      {
        kind: predict,
        id: alias,
        type: text,
        answer: "2",
        wrong: ["1 -> VAL-ASSIGN-COPIES-OBJECT"],
      }
    visual:
      {
        component: MemoryDiagram,
        example: values-alias,
        gate: alias,
        new_parts: [object-box, reference-arrow],
        pauseAt: [3],
      }
    doubt: "So does let b = a copy the object or not?"
    facts: [assignment, identity, reference-record]

  - id: s07-identity
    goal: "Every object has its own identity, so two objects with equal contents are still two objects, while primitives have no identity"
    terms_introduced: [identity]
    terms_used: [object, primitive, reference]
    words: 120-170
    code: "runnable: {n:1} === {n:1} false; a === c true; 'hi' === 'hi' true; Symbol('id') === Symbol('id') false"
    interaction: { kind: run }
    doubt: "If a and b look exactly alike, in what way are they different?"
    java: "Like Java's == on two new objects; unlike Java, JS strings have no identity, so === compares their characters."
    facts: [identity, java-equality]

  - id: s08-mutation
