frontmatter:
  id: js-values
  track: javascript
  title: Values and references
  minutes: 90
  prereqs: [fnd-how-programs-run]
  outcomes:
    - Draw what each binding points to after assignment, mutation, reassignment and a function call, and predict what every other name sees
    - Explain ===, == and Object.is by walking their spec algorithms (IsStrictlyEqual, IsLooselyEqual with ToPrimitive, SameValue), including NaN and the two zeros
    - Tell a shallow copy from a deep copy, and implement deepEqual and deepClone that handle cycles, Dates, Maps and Sets
  sources:
    - https://tc39.es/ecma262/#sec-ecmascript-language-types
    - https://tc39.es/ecma262/#sec-identity
    - https://tc39.es/ecma262/#sec-islooselyequal
    - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness
    - https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm
    - https://v8.dev/blog/pointer-compression
  interviewTags: [frontend, fullstack, javascript-fundamentals]
  status: draft
  verifiedAt: 2026-11

# Every behaviour the lesson relies on, with where it was read (fetched 2026-11-15).
facts:
  - id: language-types
    text: "6.1: 'The ECMAScript language types are Undefined, Null, Boolean, String, Symbol, Number, BigInt, and Object.' 'An ECMAScript language value that is not an Object is a primitive value.'"
    url: https://tc39.es/ecma262/#sec-ecmascript-language-types
  - id: object-type
    text: "6.1.7: 'Each instance of the Object type ... represents a collection of properties.' 'All functions in ECMAScript are members of the Object type.'"
    url: https://tc39.es/ecma262/#sec-object-type
  - id: null-type
    text: "6.1.2: 'The Null type has exactly one value, called null, representing the intentional absence of any object value.' 6.1.1: Undefined has exactly one value, undefined."
    url: https://tc39.es/ecma262/#sec-ecmascript-language-types-null-type
  - id: number-type
    text: "6.1.6.1: Number values are IEEE 754-2019 binary64 doubles; all NaN bit patterns are one NaN value to JS code; 'there is both a positive zero and a negative zero', produced by +0 and -0."
    url: https://tc39.es/ecma262/#sec-ecmascript-language-types-number-type
  - id: mdn-immutable
    text: "MDN Data structures: 'All types except Object define immutable values represented directly at the lowest level of the language. We refer to values of these types as primitive values.' 'JavaScript strings are immutable.' 'In JavaScript, objects are the only mutable values.'"
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures
  - id: typeof-algorithm
    text: "13.5.3.1: typeof returns 'undefined' for an unresolvable reference; null -> 'object'; String 'string'; Symbol 'symbol'; Boolean 'boolean'; Number 'number'; BigInt 'bigint'; an Object with a [[Call]] internal method -> 'function'; other objects -> 'object'."
    url: https://tc39.es/ecma262/#sec-typeof-operator
  - id: typeof-null-history
    text: "MDN typeof: in the first implementation values were a type tag plus a value; the object tag was 0; null was the NULL pointer (0x00), so it had tag 0 and typeof null is 'object'. A fix (typeof null === 'null') was proposed via opt-in and rejected."
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/typeof
  - id: wires
    text: "Just JavaScript ep. 3 (Dan Abramov): 'Variables are not values.' 'A “wire” is not a JavaScript concept—but it helps us imagine how variables point to values.' 'We can’t change primitive values.' On calls: 'We pass the current value of the pet variable.'"
    url: https://justjavascript.com/learn/03-values-and-variables
  - id: identity
    text: "5.2.8: 'each value with identity is unique and therefore only equal to itself.' 'references to these values must be explicitly passed from one place to another.' 'Some values with identity are mutable ... causing all holders of the value to observe the new characteristics.' Without identity: undefined, null, Booleans, Strings, Numbers, BigInts. With identity: Objects and Symbols not produced by Symbol.for."
    url: https://tc39.es/ecma262/#sec-identity
  - id: reference-record
    text: "6.2.5: the spec's 'Reference Record' is 'a resolved name or (possibly not-yet-resolved) property binding' used to explain delete, typeof, assignment. It is not the everyday word 'reference' (an arrow to an object)."
    url: https://tc39.es/ecma262/#sec-reference-record-specification-type
  - id: assignment
    text: "13.15.2: for `LeftHandSideExpression = AssignmentExpression`, evaluate the left side to a reference (a name or a property), evaluate the right side with GetValue, then PutValue(leftRef, rightValue). The right side's value is what is stored; for an object that value is the object itself, by identity, never a copy."
    url: https://tc39.es/ecma262/#sec-assignment-operators-runtime-semantics-evaluation
  - id: const-binding
    text: "const declarations call CreateImmutableBinding(name, true); 9.1.1.1.5 SetMutableBinding: for an immutable binding 'If strict is true, throw a TypeError exception', and a binding created with strict true is a strict binding, so assignment to a const always throws."
    url: https://tc39.es/ecma262/#sec-declarative-environment-records-setmutablebinding-n-v-s
  - id: mdn-const
    text: "MDN const: 'create immutable bindings, not immutable values'. Node message: 'TypeError: Assignment to constant variable.'"
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const
  - id: arguments
    text: "13.3.8.1 ArgumentListEvaluation 'returns ... a List of ECMAScript language values'; the parameters are bound to those values."
    url: https://tc39.es/ecma262/#sec-runtime-semantics-argumentlistevaluation
  - id: java-pass
    text: "Oracle Java tutorial: 'Reference data type parameters, such as objects, are also passed into methods by value. This means that when the method returns, the passed-in reference still references the same object as before. However, the values of the object's fields can be changed in the method'."
    url: https://docs.oracle.com/javase/tutorial/java/javaOO/arguments.html
  - id: java-equality
    text: "JLS 15.21.3: 'the result of == is true if the operand values are both null or both refer to the same object or array'; for two distinct String objects with the same characters == is false; 'The contents of two strings s and t can be tested for equality by the method invocation s.equals(t).'"
    url: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.21.3
  - id: no-heap-in-spec
    text: "The word 'heap' appears 0 times in the full ECMAScript spec text (tc39.es/ecma262, fetched 2026-11-15, counted by script); 'execution context stack' appears 54 times and is about running code, not storing values."
    url: https://tc39.es/ecma262/
  - id: v8-values
    text: "V8 blog, Pointer compression: 'JavaScript values in V8 are represented as objects and allocated on the V8 heap.' Small integers: 'the value of an integer can be stored directly in the tagged value, without having to allocate additional storage for it.'"
    url: https://v8.dev/blog/pointer-compression
  - id: jvm-heap
    text: "JVM spec 2.5.3: 'The Java Virtual Machine has a heap that is shared among all Java Virtual Machine threads. The heap is the run-time data area from which memory for all class instances and arrays is allocated.' 2.6: 'Each frame has its own array of local variables'."
    url: https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-2.html#jvms-2.5.3
  - id: is-strictly-equal
    text: "7.2.14 IsStrictlyEqual: 1. If SameType(x, y) is false, return false. 2. If x is a Number, return Number::equal(x, y). 3. Return SameValueNonNumber(x, y)."
    url: https://tc39.es/ecma262/#sec-isstrictlyequal
  - id: number-equal
    text: "6.1.6.1.13 Number::equal: If x is NaN, return false. If y is NaN, return false. If x is y, return true. +0/-0 in either order return true. Otherwise false."
    url: https://tc39.es/ecma262/#sec-numeric-types-number-equal
  - id: same-value-non-number
    text: "7.2.11 SameValueNonNumber: undefined/null -> true; BigInt -> BigInt::equal; String -> same length and same code units in the same positions; Boolean -> both true or both false; 'NOTE: All other ECMAScript language values are compared by identity.'"
    url: https://tc39.es/ecma262/#sec-samevaluenonnumber
  - id: nan-ieee
    text: "MDN NaN: 'NaN compares unequal (via ==, !=, ===, and !==) to any other value — including to another NaN value.' 'NaN and its behaviors are not invented by JavaScript. Its semantics in floating point arithmetic (including that NaN !== NaN) are specified by IEEE 754.' Operations returning NaN: failed number conversion, Math.sqrt(-1), 0 * Infinity, NaN-contagion, invalid Date. indexOf cannot find NaN; includes can."
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/NaN
  - id: same-value
    text: "7.2.9 SameValue: same as IsStrictlyEqual except Number::sameValue: NaN and NaN -> true; +0 and -0 -> false. 20.1.2.15: Object.is(value1, value2) returns SameValue(value1, value2). 7.2.10 SameValueZero treats +0 and -0 as equal and NaN equal to NaN."
    url: https://tc39.es/ecma262/#sec-samevalue
  - id: same-value-zero-users
    text: "MDN Equality: SameValueZero is 'used by Array.prototype.includes(), TypedArray.prototype.includes(), as well as Map and Set methods for comparing key equality.' 'Strict equality is almost always the correct comparison operation to use.' 'In most cases, using loose equality is discouraged.'"
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness
  - id: is-loosely-equal
    text: "7.2.13 IsLooselyEqual: 1 same type -> IsStrictlyEqual. 2-3 null/undefined pair -> true. 4 [[IsHTMLDDA]] (document.all, browsers only). 5-6 Number vs String -> ToNumber the string. 7-8 BigInt vs String. 9-10 a Boolean side -> ToNumber it. 11-12 Object vs String/Number/BigInt/Symbol -> ToPrimitive the object. 13 BigInt vs finite Number by math value. 14 Return false. 13.11.1: == calls IsLooselyEqual(rightValue, leftValue); every rule comes in a mirrored pair, so operand order does not change results (Note 1: A == B is equivalent to B == A except in the order of evaluation)."
    url: https://tc39.es/ecma262/#sec-islooselyequal
  - id: to-number
    text: "7.1.4 ToNumber: undefined -> NaN; null or false -> +0; true -> 1; String -> StringToNumber; Object -> ToPrimitive(arg, number) then ToNumber."
    url: https://tc39.es/ecma262/#sec-tonumber
  - id: to-primitive
    text: "7.1.1 ToPrimitive: if the object has a Symbol.toPrimitive method, call it with hint 'default'/'string'/'number'; otherwise, if preferredType is not present set it to number and call OrdinaryToPrimitive. 7.1.1.1: hint string tries toString then valueOf; otherwise valueOf then toString; the first that returns a non-object wins; else TypeError. Note: only Dates and Symbol objects override it; 'Dates treat the absence of a hint as if the hint were string.'"
    url: https://tc39.es/ecma262/#sec-toprimitive
  - id: to-string
    text: "7.1.19 ToString of an Object: ToPrimitive(arg, string). Template literal substitutions are converted with ToString (13.2.8.6)."
    url: https://tc39.es/ecma262/#sec-tostring
  - id: shallow-copy
    text: "MDN Shallow copy: 'a copy whose properties share the same references ... as those of the source object'. 'all standard built-in object-copy operations (spread syntax, Array.prototype.concat(), Array.prototype.slice(), Array.from(), and Object.assign()) create shallow copies'."
    url: https://developer.mozilla.org/en-US/docs/Glossary/Shallow_copy
  - id: object-assign
    text: "MDN Object.assign: copies all enumerable own properties (String and Symbol keys); uses [[Get]] and [[Set]] so getters and setters run; 'If the source value is a reference to an object, it only copies the reference value.'"
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/assign
  - id: deep-copy
    text: "MDN Deep copy: 'a copy whose properties do not share the same references'. JSON round trip fails for functions, Symbols, recursive data. 'structuredClone() isn't a feature of the JavaScript language itself — instead it's a feature of browsers and other JavaScript hosts'."
    url: https://developer.mozilla.org/en-US/docs/Glossary/Deep_copy
  - id: structured-clone
    text: "MDN Structured clone algorithm: functions throw DataCloneError; DOM nodes throw; RegExp lastIndex, property descriptors, getters/setters are not preserved; 'The prototype chain is not walked or duplicated'; class private elements not duplicated; supports Array, Date, Map, Set, plain Object, primitives except symbol, RegExp, Error types, typed arrays; keeps a map of visited references to handle cycles. MDN structuredClone: example keeps clone.itself === clone."
    url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm
  - id: node-deep-strict
    text: 'Node assert.deepStrictEqual comparison details: ''Primitive values are compared using Object.is().'' ''[[Prototype]] of objects are compared using the === operator.'' ''Only enumerable "own" properties are considered.'' ''Map keys and Set items are compared unordered.'' ''Recursion stops when both sides differ or either side encounters a circular reference.'''
    url: https://nodejs.org/api/assert.html#assertdeepstrictequalactual-expected-message
  - id: react-object-is
    text: "react.dev useState: 'If the new value you provide is identical to the current state, as determined by an Object.is comparison, React will skip re-rendering the component and its children.' Mutating obj then setObj(obj) 'Doesn't do anything'; 'you should replace it rather than mutate your existing objects'."
    url: https://react.dev/reference/react/useState
  - id: zod-clone
    text: "zod.dev basics: 'If it's valid, Zod returns a strongly-typed deep clone of the input.'"
    url: https://zod.dev/basics
  - id: progmiscon
    text: "progmiscon JavaScript: AssignmentCopiesObject 'Assignment copies the object'; ConstReferenceImpliesImmutability 'An object referred to by a const variable is an immutable object'."
    url: https://progmiscon.org/misconceptions/JavaScript/

