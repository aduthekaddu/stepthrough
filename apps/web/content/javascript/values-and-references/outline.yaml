  - {
      id: strict-equality,
      status: new,
      segment: s12-strict-equality,
      definition: "The === comparison. Different types are never equal; numbers compare by value except NaN; strings compare by their characters; objects compare by identity.",
      spec: "IsStrictlyEqual",
    }
  - {
      id: nan,
      status: new,
      segment: s12-strict-equality,
      definition: 'NaN, the one Number value that means "not a number". It is the only value that is not === to itself.',
      spec: "NaN (Number type)",
    }
  - {
      id: same-value,
      status: new,
      segment: s13-same-value,
      definition: "The comparison Object.is uses. Like === except that NaN equals NaN and +0 does not equal -0.",
      spec: "SameValue",
    }
  - {
      id: loose-equality,
      status: new,
      segment: s14-loose-equality,
      definition: "The == comparison. If the two sides have different types, it converts one side, step by step, then compares again.",
      spec: "IsLooselyEqual",
    }
  - {
      id: coercion,
      status: new,
      segment: s14-loose-equality,
      definition: "Teaching name for a conversion from one type to another that an operator does for you, such as ToNumber inside ==. Not a single spec operation.",
    }
  - {
      id: shallow-copy,
      status: new,
      segment: s16-shallow-copy,
      definition: "A new outer object whose properties hold the same values as the original, so nested objects are shared, not copied.",
    }
  - {
      id: deep-copy,
      status: new,
      segment: s17-deep-copy,
      definition: "A copy in which every nested object is copied too, so changing the copy never changes the original.",
