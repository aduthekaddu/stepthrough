# Visual-first (DECISIONS.md 2026-11-16): each segment opens with its `visual`, whose captions
# carry the explanation, about 35 words per step. `words` is prose outside the captions and outside
# Go deeper. Everything else the segment used to say sits in its Go deeper block. Minutes are approximate.
segments:
  - id: s01-hook
    goal: "Running a file is not reading it one line at a time"
    minutes: 4
    terms_introduced: []
    terms_used: []
    words: 0-40
    code: examples in index (p-hook)
    interaction: { kind: predict, id: p-hook }
    doubt: null
  - id: s02-program
    goal: "A program is instructions, and the CPU cannot read the text you write"
    minutes: 3
    terms_introduced: [program, source-code, cpu]
    terms_used: []
    words: 0-40
    code: "add(2, 3) and add.toString() (runnable)"
    visual: { component: Figure, diagram: text-vs-chip }
    interaction: { kind: run }
    doubt: "If the computer runs my JavaScript, surely the chip understands JavaScript?"
  - id: s03-machine-code
    goal: "The CPU runs only machine code: numbered instructions stored as bytes"
    minutes: 4
    terms_introduced: [machine-code, byte, compiler]
    terms_used: [cpu, source-code, program]
    words: 0-40
    code: "C add() compiled by gcc to 8d 04 37 c3 (measured m-machine-code)"
    visual: { component: Figure, diagram: machine-code }
    interaction: { kind: explain, id: e-cpu }
    doubt: "Why can't one set of bytes run on every computer?"
  - id: s04-memory
    goal: "Memory is one long row of bytes, each with a numbered address"
    minutes: 4
    terms_introduced: [memory, address]
    terms_used: [byte, cpu, program]
    words: 0-40
    code: "Uint8Array as a model of a few bytes"
    visual: { component: Figure, diagram: memory-bytes }
    interaction: { kind: predict, id: p-byte }
    doubt: "Is a Uint8Array real memory?"
  - id: s05-process
    goal: "The operating system runs each program as a process with its own private memory"
    minutes: 4
    terms_introduced: [operating-system, process]
    terms_used: [memory, address, program]
    words: 0-40
    code: "/proc/self/maps from two node runs (measured m-maps)"
    visual: { component: Figure, diagram: process-memory }
    interaction: { kind: predict, id: p-tabs }
    doubt: "Are two browser tabs two processes?"
  - id: s06-thread
    goal: "A thread is one path of execution, and JavaScript runs your code on one thread at a time"
    minutes: 4
    terms_introduced: [thread]
    terms_used: [process, memory, cpu]
    words: 0-40
    visual:
      [
        { component: Figure, diagram: threads },
        { component: Figure, diagram: busy-loop, gate: p-busy },
      ]
    interaction: { kind: predict, id: p-busy }
    doubt: "If the computer has many cores, why does my loop block the timer?"
  - id: s07-interpreter
    goal: "A compiler translates ahead of time; an interpreter carries out code itself; bytecode sits between"
    minutes: 4
    terms_introduced: [interpreter, bytecode]
    terms_used: [compiler, machine-code, cpu, source-code]
    words: 0-40
    code: "C path vs Java path (javac, JVM -Xmixed)"
    visual: { component: Figure, diagram: compile-vs-interpret }
    interaction: { kind: explain, id: e-compile }
    doubt: "So is Java compiled or interpreted?"
  - id: s08-engine-host
    goal: "The engine implements the language; the runtime (host) adds the outside world"
    minutes: 4
    terms_introduced: [engine, runtime]
    terms_used: [interpreter, compiler, source-code]
    words: 0-40
    visual: { component: Figure, diagram: engine-runtime }
    interaction: { kind: predict, id: p-host }
    doubt: "Isn't console.log part of JavaScript?"
  - id: s09-parse-first
    goal: "The engine parses the whole script before running any of it, so early errors stop everything"
    minutes: 4
    terms_introduced: []
    terms_used: [engine, source-code]
    words: 0-40
    visual: { component: Figure, diagram: parse-then-run }
    interaction: { kind: predict, id: p-parse-first, modifies: p-hook }
    doubt: "Why would the language check code that never runs?"
  - id: s10-bytecode
    goal: "V8 turns each function into bytecode, usually the first time it is called"
    minutes: 4
    terms_introduced: []
    terms_used: [bytecode, interpreter, engine, byte]
    words: 0-40
    code: "real --print-bytecode output for add (m-bytecode)"
    visual: { component: Figure, diagram: ignition-bytecode }
    interaction: { kind: predict, id: p-lazy }
    doubt: "Why not turn everything into bytecode at once?"
  - id: s11-jit
    goal: "Hot functions get compiled to machine code while the program runs, based on what V8 has seen"
    minutes: 4
    terms_introduced: [jit]
    terms_used: [bytecode, interpreter, machine-code, compiler, engine]
    words: 0-40
    visual: { component: Figure, diagram: jit-tiers }
    interaction: { kind: predict, id: p-faster }
    doubt: "If compiled code is faster, why not compile everything at the start?"
  - id: s12-deopt
    goal: "Optimized code rests on guesses, and when a guess fails V8 throws the code away, never the meaning"
    minutes: 4
    terms_introduced: []
    terms_used: [jit, bytecode, interpreter, thread]
    words: 0-40
    code: "real --trace-opt --trace-deopt output (m-trace-opt)"
    visual: { component: Figure, diagram: deopt, gate: p-deopt }
    interaction: { kind: predict, id: p-deopt, then: { kind: explain, id: e-deopt } }
