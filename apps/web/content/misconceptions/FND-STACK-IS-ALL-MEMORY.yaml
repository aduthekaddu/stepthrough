id: FND-STACK-IS-ALL-MEMORY
belief: "The call stack can grow until the computer's RAM is full."
predicts: "Deep recursion fails only after using gigabytes, and the computer slows down first."
truth: "Each thread's stack has a small fixed size chosen by the engine or the OS. V8's default --stack-size is 984 KB, so about ten thousand simple frames fit. Objects in the heap can use far more memory than that."
counterexample: "A no-argument recursive function reached depth 12517 before RangeError in Node v26 (measured; varies by engine and frame size)."
sources:
  - "https://man7.org/linux/man-pages/man7/pthreads.7.html"
  - "inferred"
lessons:
  - fnd-how-programs-run
