id: EXC-IMPLICIT-NOT-PROPERTY
belief: An implicit global is a global variable like a top-level let, not a property of the global object.
predicts: function save() { total = 42; } save(); console.log(total, globalThis.total); prints 42 undefined.
truth: "In non-strict code, PutValue on an unresolvable reference performs Set(globalObj, name, value): the implicit global is a property of the global object, found later through the object part of the global record."
counterexample: The code above prints 42 42.
sources:
  - https://tc39.es/ecma262/multipage/ecmascript-data-types-and-values.html#sec-putvalue
  - Inferred
lessons:
  - js-execution-context
