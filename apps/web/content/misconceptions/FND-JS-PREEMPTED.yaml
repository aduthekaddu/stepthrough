id: FND-JS-PREEMPTED
belief: "A timer or another piece of JavaScript can interrupt a function that is still running, the way the OS switches threads."
predicts: "A 0 ms timer prints before a 100 ms busy loop that started after it finishes."
truth: "An agent runs one piece of JavaScript at a time on its thread, and each job runs to completion. A timer callback waits for its turn until the running code has finished. (Workers are separate agents with their own threads and memory; callbacks you call directly, like forEach's, run inside the current work.)"
counterexample: 'setTimeout(() => console.log("timer"), 0) followed by a 100 ms busy loop that logs "loop done" prints loop done, then timer.'
sources:
  - "https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-jobs"
  - "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Execution_model"
  - "inferred: transfer from Java threads, which the OS can switch between at any instruction"
lessons:
  - fnd-how-programs-run
