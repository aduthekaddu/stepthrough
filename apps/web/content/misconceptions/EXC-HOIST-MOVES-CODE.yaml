id: EXC-HOIST-MOVES-CODE
belief: Hoisting moves declarations, together with their "= value" part, to the top of the code before it runs.
predicts: Reading a var before its line gives the assigned value (console.log(x); var x = 5; prints 5).
truth: No code moves. Declaration instantiation creates the binding and sets it to undefined; the "= value" part is an ordinary assignment that runs when execution reaches that line.
counterexample: console.log(price); var price = 100; prints undefined.
sources:
  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var
  - https://tc39.es/ecma262/multipage/ecmascript-language-statements-and-declarations.html#sec-variable-statement-runtime-semantics-evaluation
lessons:
  - js-execution-context
