id: TDZ-IS-SPATIAL
belief: Code written above a let or const line can never use that name, even if the code runs after the line.
predicts: function read() { return limit; } let limit = 10; console.log(read()); throws a ReferenceError.
truth: The dead zone is about time, not position. The binding is uninitialized only until its declaration runs; a function that reads it later works.
counterexample: The code above prints 10.
sources:
  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let
  - "https://doi.org/10.1145/3386327 (Wirfs-Brock and Eich, JavaScript: The First 20 Years, pp. 111-113)"
lessons:
  - js-execution-context
