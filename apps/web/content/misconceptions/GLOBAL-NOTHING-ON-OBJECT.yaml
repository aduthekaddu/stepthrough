id: GLOBAL-NOTHING-ON-OBJECT
belief: Top-level declarations never create properties on the global object.
predicts: var a = 1; console.log(globalThis.a); prints undefined.
truth: In a classic script, top-level var and function declarations are bindings of the global object. The belief is true only for modules (ES modules and CommonJS), where top-level declarations belong to the module.
counterexample: In a classic script, var a = 1; console.log(globalThis.a); prints 1.
sources:
  - https://tc39.es/ecma262/multipage/executable-code-and-execution-contexts.html#sec-global-environment-records
  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var
  - Inferred; matches the experience of someone who writes only modules
lessons:
  - js-execution-context
