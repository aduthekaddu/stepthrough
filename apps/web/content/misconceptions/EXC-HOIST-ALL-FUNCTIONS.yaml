id: EXC-HOIST-ALL-FUNCTIONS
belief: Every way of writing a function can be called before its line, like a function declaration.
predicts: run(); var run = function () {}; works, and add(); const add = () => {}; works.
truth: Only function declarations get their function object during declaration instantiation. A function expression or arrow function is a value that is created when its line runs; until then the name follows the rules of its var, let or const.
counterexample: "run(); var run = function () {}; throws TypeError: run is not a function. add(); const add = () => {}; throws ReferenceError: Cannot access 'add' before initialization."
sources:
  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function
  - https://tc39.es/ecma262/multipage/ecmascript-language-functions-and-classes.html#sec-function-definitions-runtime-semantics-evaluation
lessons:
  - js-execution-context
