id: EC-TOP-TO-BOTTOM
belief: The engine runs a script strictly line by line, and a name does not exist until the line that declares it has run.
predicts: 'Any use of a name above its declaring line throws "ReferenceError: x is not defined", even for function declarations and for var.'
truth: Before the first statement runs, declaration instantiation creates a binding for every declaration in the script or function body, including ones inside code that never runs.
counterexample: console.log(double(4)); function double(n) { return n * 2; } prints 8, and console.log(x); var x = 1; prints undefined, not a ReferenceError.
sources:
  - https://tc39.es/ecma262/multipage/ecmascript-language-scripts-and-modules.html#sec-globaldeclarationinstantiation
  - https://tc39.es/ecma262/multipage/ordinary-and-exotic-objects-behaviours.html#sec-functiondeclarationinstantiation
  - Inferred; https://developer.mozilla.org/en-US/docs/Glossary/Hoisting describes the opposite behaviour
lessons:
  - js-execution-context
